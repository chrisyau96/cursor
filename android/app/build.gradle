apply plugin: 'com.android.application'

def repoRoot = rootProject.projectDir.parentFile
def versionJson = new groovy.json.JsonSlurper().parse(new File(repoRoot, "version.json"))

android {
    namespace "com.dincey.habitjournal"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.dincey.habitjournal"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode versionJson.versionCode as int
        versionName versionJson.versionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation 'com.google.android.gms:play-services-auth:21.4.0'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// Copy live web files into the AAB and stamp versionName so Play and the
// Settings footer cannot drift. Also copy capacitor.config.json so
// appStartPath cache-busts the WebView document URL.
def publicDir = file("src/main/assets/public")
def capAssetsDir = file("src/main/assets")

def stampAppVersion = { File f, String ver ->
    if (f == null || !f.exists() || f.isDirectory()) return
    def t = f.getText('UTF-8')
    t = t.replaceAll(/window\.MOMENTUM_APP_VERSION = '[^']+'/, "window.MOMENTUM_APP_VERSION = '${ver}'")
    t = t.replaceAll(/Launch\.APP_VERSION = '[^']+'/, "Launch.APP_VERSION = '${ver}'")
    t = t.replaceAll(/\?v=[0-9]+\.[0-9]+\.[0-9]+/, "?v=${ver}")
    t = t.replaceAll(/habit-journal-[0-9]+\.[0-9]+\.[0-9]+/, "habit-journal-${ver}")
    f.write(t, 'UTF-8')
}

tasks.register("syncWebAssets") {
    doLast {
        def index = new File(repoRoot, "index.html")
        if (!index.exists()) {
            throw new GradleException("index.html not found at ${repoRoot}. Open android/ from the Habit & Journal git repo, then Generate Signed Bundle.")
        }
        def ver = versionJson.versionName
        publicDir.mkdirs()
        capAssetsDir.mkdirs()
        copy {
            from(repoRoot) {
                include "index.html"
                include "privacy.html"
                include "sw.js"
                include "manifest.webmanifest"
            }
            into publicDir
        }
        copy {
            from(new File(repoRoot, "assets")) {
                exclude "js/config.local.js"
            }
            into new File(publicDir, "assets")
        }
        copy {
            from(new File(repoRoot, "capacitor.config.json"))
            into capAssetsDir
        }
        stampAppVersion(new File(publicDir, "index.html"), ver)
        stampAppVersion(new File(publicDir, "sw.js"), ver)
        stampAppVersion(new File(publicDir, "assets/js/app.js"), ver)
        stampAppVersion(new File(publicDir, "assets/js/launch-core.js"), ver)
        stampAppVersion(new File(capAssetsDir, "capacitor.config.json"), ver)
        logger.lifecycle("Copied Habit & Journal ${ver} web assets into ${publicDir}")
    }
}
afterEvaluate {
    tasks.matching { it.name == "preBuild" }.configureEach { dependsOn("syncWebAssets") }
}
